{% extends "base.html" %}

{% block content %}
<div class="not-found">
  <svg class="icon icon-large" aria-hidden="true"><use href="#icon-x-circle"/></svg>
  <h1>{{ title if title else "Страница не найдена" }}</h1>
  <p>Запрошенный ресурс не существует или был удалён.</p>
  <a href="/" class="btn btn-secondary">

</div>
{% endblock %}
